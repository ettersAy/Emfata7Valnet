<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Credential Launcher Settings</title>
    <link rel="stylesheet" href="src/options/options.css" />
  </head>
  <body>
    <main class="settings">
      <header>
        <h1>⚙ Field Keyword Settings</h1>
        <p class="subtitle">
          Customize the keywords used to detect username and password fields
          during autofill.
        </p>
      </header>

      <div class="card">
        <h2>🔑 User Field Keywords</h2>
        <p>Comma-separated words that identify username / email fields.</p>
        <label>
          Keywords
          <textarea id="userKeywords" rows="3" placeholder="email, user, username, login, identifier"></textarea>
        </label>
        <div id="userKeywordPreview" class="keyword-chips"></div>
      </div>

      <div class="card">
        <h2>🔒 Password Field Keywords</h2>
        <p>Comma-separated words that identify password fields.</p>
        <label>
          Keywords
          <textarea id="passwordKeywords" rows="3" placeholder="password, pwd, passcode, pin"></textarea>
        </label>
        <div id="passwordKeywordPreview" class="keyword-chips"></div>
      </div>

      <button id="saveSettings" class="primary">💾 Save Settings</button>
      <p id="saveMessage" aria-live="polite"></p>
    </main>
    <script type="module" src="src/options/options-main.js"></script>
  </body>
</html>
