<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Credential Launcher</title>
    <link rel="stylesheet" href="src/popup/popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <div class="app__brand">
          <div class="logo">🔐</div>
          <div>
            <h1>Vault</h1>
            <p class="muted">Quick, secure credential launcher</p>
          </div>
        </div>
        <div class="actions">
          <button id="addSiteBtn" class="icon-btn" title="Add entry">+</button>
          <button id="openSettingsBtn" class="icon-btn" title="Settings">⚙</button>
        </div>
      </header>

      <section id="vaultGate" class="vault-gate">
        <div class="vault-gate__icon">🔒</div>
        <h2>Vault Locked</h2>
        <p id="vaultHint" class="vault-gate__hint"></p>
        <div class="vault-gate__input-row">
          <input id="masterPassword" type="password" placeholder="Enter master key…" autocomplete="off" />
          <button id="togglePasswordVisibility" class="eye-btn" type="button" title="Show password">👁</button>
        </div>
        <div id="passwordStrength" class="password-strength" hidden>
          <div class="strength-bar"><span class="strength-fill"></span></div>
          <span class="strength-label"></span>
        </div>
        <button id="unlockVaultBtn" class="primary primary--glow" type="button">Unlock</button>
        <p id="vaultMessage" aria-live="polite" class="vault-gate__message"></p>
      </section>

      <div id="searchBar" class="search-bar" hidden>
        <input id="searchInput" type="text" placeholder="🔍 Search entries…" />
        <span id="entryCount" class="entry-count"></span>
      </div>

      <p id="listMessage" class="toast" hidden></p>
      <section id="websiteList" class="site-list" hidden></section>
    </main>

    <dialog id="siteDialog" class="modal">
      <form id="siteForm" method="dialog" class="modal__content">
        <h2 id="siteDialogTitle">Add website</h2>
        <label>
          Website / Alias
          <input id="siteUrl" name="url" type="text" required placeholder="example.com or any note" />
        </label>
        <label>
          Label
          <input id="siteLabel" name="label" type="text" required placeholder="Work account" />
        </label>

        <div class="credentials-header">
          <h3>Credentials</h3>
          <button id="addCredentialBtn" class="btn--outline" type="button">+ Add</button>
        </div>
        <div id="credentialsContainer" class="credentials-container"></div>

        <menu class="modal__actions">
          <button value="cancel" type="button" id="cancelSiteDialog">Cancel</button>
          <button value="confirm" type="submit" class="primary">Save</button>
        </menu>
      </form>
    </dialog>

    <template id="credentialRowTemplate">
      <div class="credential-row">
        <input class="credential-name" type="text" placeholder="Label" required />
        <input class="credential-username" type="text" placeholder="Username" required />
        <div class="password-input-wrap">
          <input class="credential-password" type="password" placeholder="Password" required />
          <button type="button" class="toggle-pass-btn" tabindex="-1">👁</button>
        </div>
        <button type="button" class="remove-credential" title="Remove">✕</button>
      </div>
    </template>

    <script type="module" src="src/popup/popup-main.js"></script>
  </body>
</html>
