<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Credential Launcher</title>
    <link rel="stylesheet" href="src/popup/popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <div>
          <h1>Vault</h1>
          <p class="muted">Quick, secure credential launcher</p>
        </div>
        <div class="actions">
          <button id="addSiteBtn" class="icon-btn" title="Add">＋</button>
          <button id="openSettingsBtn" class="icon-btn" title="Settings">⚙</button>
        </div>
      </header>
<<<<<<< HEAD
      <section id="vaultGate" class="vault-gate card">
        <h2>Locked</h2>
        <p id="vaultHint"></p>
        <input id="masterPassword" type="password" placeholder="Master key" />
        <button id="unlockVaultBtn" class="primary" type="button">Unlock</button>
        <p id="vaultMessage" aria-live="polite" class="muted"></p>
      </section>

      <p id="listMessage" class="muted"></p>
      <section id="websiteList" class="site-list" hidden></section>
    </main>

    <dialog id="siteDialog" class="modal">
      <form id="siteForm" method="dialog" class="modal__content">
        <h2 id="siteDialogTitle">Add website</h2>
        <label>
          Website / Alias
          <input id="siteUrl" name="url" type="text" required placeholder="example.com or any note" />
        </label>
        <label>
          Label
          <input id="siteLabel" name="label" type="text" required placeholder="Work account" />
        </label>

        <div class="credentials-header">
          <h3>Credentials</h3>
          <button id="addCredentialBtn" type="button">+ Add</button>
        </div>
        <div id="credentialsContainer" class="credentials-container"></div>

        <menu class="modal__actions">
          <button value="cancel" type="button" id="cancelSiteDialog">Cancel</button>
          <button value="confirm" type="submit" class="primary">Save</button>
        </menu>
      </form>
    </dialog>

    <template id="credentialRowTemplate">
      <div class="credential-row">
        <input class="credential-name" type="text" placeholder="login label" required />
        <input class="credential-username" type="text" placeholder="username/email" required />
        <input class="credential-password" type="password" placeholder="password" required />
        <button type="button" class="remove-credential">✕</button>
      </div>
    </template>

    <script type="module" src="src/popup/popup-main.js"></script>
  </body>
</html>
