<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="appName">مفاتيح</title>
    <link rel="stylesheet" href="src/popup/popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <div class="app__brand">
          <div class="logo">🔑</div>
          <div>
            <h1 data-i18n="appName">مفاتيح</h1>
            <p class="muted" data-i18n="appSubtitle">مدير كلمات المرور الآمن</p>
          </div>
        </div>
        <div class="actions">
          <button id="lockVaultBtn" class="icon-btn" data-i18n-title="lockVaultTitle" title="Lock vault" hidden>🔒</button>
          <button id="addSiteBtn" class="icon-btn" data-i18n-title="addBtn" title="Add entry">+</button>
          <button id="openSettingsBtn" class="icon-btn" title="Settings">⚙</button>
        </div>
      </header>

      <section id="vaultGate" class="vault-gate">
        <div class="vault-gate__icon">🔒</div>
        <h2 data-i18n="vaultLocked">الخزنة مقفلة</h2>
        <p id="vaultHint" class="vault-gate__hint"></p>
        <div class="vault-gate__input-row">
          <input id="masterPassword" type="password" data-i18n-placeholder="masterPasswordPlaceholder" placeholder="أدخل المفتاح الرئيسي…" autocomplete="off" />
          <button id="togglePasswordVisibility" class="eye-btn" type="button" data-i18n-title="togglePasswordVisibility" title="إظهار كلمة المرور">👁</button>
        </div>
        <div id="passwordStrength" class="password-strength" hidden>
          <div class="strength-bar"><span class="strength-fill"></span></div>
          <span class="strength-label"></span>
        </div>
        <button id="unlockVaultBtn" class="primary primary--glow" type="button">فتح</button>
        <p id="vaultMessage" aria-live="polite" class="vault-gate__message"></p>
      </section>

      <div id="searchBar" class="search-bar" hidden>
        <input id="searchInput" type="text" data-i18n-placeholder="searchPlaceholder" placeholder="🔍 بحث…" />
        <span id="entryCount" class="entry-count"></span>
      </div>

      <p id="listMessage" class="toast" hidden></p>
      <section id="websiteList" class="site-list" hidden></section>

      <button id="expandListBtn" class="expand-list-btn" hidden title="Show entries">📋 المفاتيح</button>

      <section id="minimizedList" class="minimized-list" hidden></section>
    </main>

    <dialog id="siteDialog" class="modal">
      <form id="siteForm" method="dialog" class="modal__content">
        <h2 id="siteDialogTitle" data-i18n="addSiteTitle">إضافة موقع</h2>
        <label>
          <span data-i18n="siteUrlLabel">الموقع / الاسم المستعار</span>
          <input id="siteUrl" name="url" type="text" required data-i18n-placeholder="siteUrlPlaceholder" placeholder="example.com أو أي ملاحظة" />
        </label>

        <div id="credentialsContainer" class="credentials-container">
          <span class="credentials-container__title" data-i18n="credentialsListTitle">بيانات الدخول</span>
          <div id="credentialPairs" class="credential-pairs">
            <!-- Credential pair fields are added dynamically -->
          </div>
          <button type="button" id="addCredentialBtn" class="btn--outline add-cred-btn" data-i18n="addCredentialBtn">+ إضافة بيانات دخول</button>
        </div>

        <menu class="modal__actions">
          <button value="cancel" type="button" id="cancelSiteDialog" data-i18n="cancelBtn">إلغاء</button>
          <button value="confirm" type="submit" class="primary" data-i18n="saveBtn">حفظ</button>
        </menu>
      </form>
    </dialog>

    <template id="credentialPairTemplate">
      <div class="credential-pair-fields">
        <label class="cred-pair-login">
          <span data-i18n="siteLoginLabel">اسم المستخدم / البريد</span>
          <input type="text" class="cred-login-input" required data-i18n-placeholder="siteLoginPlaceholder" placeholder="user@example.com" />
        </label>
        <label class="cred-pair-password">
          <span data-i18n="sitePasswordLabel">كلمة المرور</span>
          <div class="password-input-wrap">
            <input type="password" class="cred-password-input" required data-i18n-placeholder="sitePasswordPlaceholder" placeholder="كلمة المرور" />
            <button type="button" class="toggle-pass-btn" tabindex="-1">👁</button>
          </div>
        </label>
        <button type="button" class="icon-btn remove-cred-btn" title="Remove">✕</button>
      </div>
    </template>

    <script type="module" src="src/popup/popup-main.js"></script>
  </body>
</html>
